name: build-and-deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yaml"

permissions:
  contents: write   # 매니페스트 태그 갱신 커밋
  packages: write   # GHCR 이미지 push

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/cloud-board

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          # 로컬 클러스터가 Apple Silicon(arm64)이므로 멀티 아키텍처로 빌드
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    # GitOps: 클러스터에 직접 배포하지 않고, 매니페스트의 이미지 태그만 갱신한다.
    # ArgoCD 가 이 커밋을 감지해 클러스터에 반영한다.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update image tags
        working-directory: k8s
        run: |
          kustomize edit set image \
            ${IMAGE_PREFIX}-backend=${IMAGE_PREFIX}-backend:${GITHUB_SHA} \
            ${IMAGE_PREFIX}-frontend=${IMAGE_PREFIX}-frontend:${GITHUB_SHA}

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy: ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
