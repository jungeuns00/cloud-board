apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-board
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jungeuns00/cloud-board.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: board
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
