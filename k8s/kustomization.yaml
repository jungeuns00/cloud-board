apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: board
resources:
- namespace.yaml
- postgres.yaml
- backend.yaml
- frontend.yaml
# CI가 push 때마다 아래 newTag 를 커밋 SHA 로 갱신하고, ArgoCD 가 이를 감지해 배포한다.
images:
- name: ghcr.io/jungeuns00/cloud-board-backend
  newName: ghcr.io/jungeuns00/cloud-board-backend
  newTag: 626b7b4c774578d89924268c9639f0f245d3f1ad
- name: ghcr.io/jungeuns00/cloud-board-frontend
  newName: ghcr.io/jungeuns00/cloud-board-frontend
  newTag: 626b7b4c774578d89924268c9639f0f245d3f1ad
